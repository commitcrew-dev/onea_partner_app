name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel a superseded run (e.g. two merges landing in quick succession)
# instead of letting both burn minutes to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Build here, on the runner's modern glibc, instead of letting Oryx
      # build it below — Oryx's bullseye-based image ships a glibc too old
      # for Rollup 4's native binary (@rollup/rollup-linux-x64-gnu needs
      # GLIBC_2.32), so an in-container build fails before it reaches our code.
      #
      # VITE_-prefixed vars are baked into the bundle at build time, not read
      # at runtime — set them here (repo/environment "Variables") if you need
      # anything other than the code's defaults (mocks on, api.example.com).
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_TIMEOUT: ${{ vars.VITE_API_TIMEOUT }}
          VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS }}
          VITE_MOCK_LATENCY: ${{ vars.VITE_MOCK_LATENCY }}
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_SUPPORT_PHONE: ${{ vars.VITE_SUPPORT_PHONE }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_SMOKE_0DEA66F00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # We already built above; this is the output to upload
          api_location: "" # Api source code path - optional
          output_location: "" # Empty — app_location already points at the built output
          skip_app_build: true # Stops Oryx from re-building (and hitting the glibc issue) inside its container
          ###### End of Repository/Build Configurations ######
